document.getElementById("view").innerHTML=`
<div class="card"><span class="pill">Lesson ${n}/42</span><h1>${l[0]}</h1><p>⏱️ 30 minutes · 🎯 Speaking + listening</p></div>
<div class="card"><h2>1. Vocabulary</h2>${l[1].map((w,i)=>`<div class="grid"><div><div class="arabic">${w}</div><div class="trans">${l[2][i]}</div></div><div><b>${l[3][i]}</b></div></div><hr>`).join('')}</div>
<div class="card"><h2>2. Speaking sentence</h2><div class="arabic">${l[4]}</div><button class="btn" onclick="speak(${JSON.stringify(l[4])})">🔊 Listen</button><p class="small">Listen twice, then repeat aloud five times.</p></div>
<div class="card"><h2>3. Speaking challenge</h2><p>Speak for 1–3 minutes using today's vocabulary. Do not stop to correct every mistake.</p><button class="btn" onclick="startMic()">🎙️ Start speaking</button><p id="speech" class="small"></p></div>
<div class="card"><h2>4. Quick check</h2><p>Type the Arabic word for <b>${l[3][0]}</b>:</p><input id="ans" placeholder="Type Arabic here"><button class="btn" onclick="check(${n})">Check</button><p id="result"></p></div>
<div class="card"><button class="btn green" onclick="complete(${n})">✓ Complete Lesson</button></div>`;
}
function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="ar-SA";u.rate=.8;speechSynthesis.speak(u)}
function startMic(){
let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){document.getElementById("speech").textContent="Speech recognition is not supported in this browser. You can still complete the speaking exercise aloud.";return}
let r=new SR();r.lang="ar-SA";r.interimResults=false;r.onresult=e=>document.getElementById("speech").textContent="You said: "+e.results[0][0].transcript;r.onerror=()=>document.getElementById("speech").textContent="Microphone recognition was unavailable.";r.start()
}
function check(n){
let val=document.getElementById("ans").value.trim(), ok=val===lessons[n-1][1][0];
document.getElementById("result").innerHTML=ok?"✅ Correct!":"❌ Try again. Hint: "+lessons[n-1][2][0];
}
function complete(n){
if(!state.completed.includes(n)){state.completed.push(n);state.completed.sort((a,b)=>a-b);state.streak++}
save(); alert("Lesson completed!"); render();
}
function examMenu(){
document.getElementById("view").innerHTML='<div class="card"><h1>Exams</h1><p>Pass each checkpoint to measure your progress.</p>'+exams.map((e,i)=>`<button class="option" onclick="exam(${i})">🧪 Checkpoint ${i+1} — after Day ${e.day}<br><span class="small">${state.scores[e.day]!==undefined?"Score: "+state.scores[e.day]+"/3":"Not taken"}</span></button>`).join('')+'</div>';
}
function exam(i){
let e=exams[i], q=e.q.map((x,j)=>`<div class="card"><b>${j+1}. ${x}</b><input id="q${j}" placeholder="Type Arabic answer"></div>`).join('');
document.getElementById("view").innerHTML=`<div class="card"><h1>Checkpoint Exam</h1><p>Answer in Arabic. Spelling without harakāt is accepted where appropriate.</p>${q}<button class="btn green" onclick="grade(${i})">Submit Exam</button><p id="grade"></p></div>`;
}
function grade(i){
let e=exams[i], score=0;e.q.forEach((_,j)=>{let x=document.getElementById("q"+j).value.trim().replace(/[ًٌٍَُِّْـ]/g,""),a=e.a[j].replace(/[ًٌٍَُِّْـ]/g,"");if(x===a)score++});
state.scores[e.day]=score;save();document.getElementById("grade").innerHTML=`<h2>${score}/3</h2>${score===3?"🎉 Excellent — checkpoint passed.":"Review the relevant lessons and try again."}`;
}
function vocab(){
let words=lessons.flatMap(l=>l[1]).slice(0,80);
document.getElementById("view").innerHTML=`<div class="card"><h1>Vocabulary Bank</h1><p>${words.length} words from your completed A1 foundation.</p>${words.map((w,i)=>`<span class="pill" dir="rtl">${w}</span>`).join('')}</div>`;
}
render();
</script>
</body></html>
